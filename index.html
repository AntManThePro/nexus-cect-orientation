<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS CECT • Hood Boss QA Orientation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ng: #00ff87;
    --nc: #60efff;
    --np: #ff0080;
    --ny: #ffcc00;
    --bg: #0a0a0f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: #e2e8f0;
    margin: 0;
    overflow: hidden;
    height: 100dvh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .neon-g { color: var(--ng); text-shadow: 0 0 12px rgba(0,255,135,0.5); }
  .neon-c { color: var(--nc); text-shadow: 0 0 12px rgba(96,239,255,0.45); }
  .neon-p { color: var(--np); text-shadow: 0 0 12px rgba(255,0,128,0.45); }
  .neon-y { color: var(--ny); text-shadow: 0 0 10px rgba(255,204,0,0.4); }
  .glass {
    background: rgba(12, 14, 22, 0.82);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 255, 135, 0.18);
  }
  .glass-strong {
    background: rgba(8, 10, 18, 0.92);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 255, 135, 0.25);
  }
  .panel-glow {
    box-shadow: 0 0 40px rgba(0, 255, 135, 0.06), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .nav-item {
    transition: all 0.18s ease;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(0,255,135,0.06); }
  .nav-item.active {
    background: rgba(0,255,135,0.12);
    border-left-color: var(--ng);
  }
  .nav-item.done { opacity: 0.85; }
  .btn-primary {
    background: var(--ng);
    color: #000;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    border: 1px solid rgba(96,239,255,0.35);
    color: var(--nc);
    transition: all 0.15s ease;
  }
  .btn-ghost:hover { background: rgba(96,239,255,0.1); }
  .checklist-item {
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .checklist-item.checked {
    opacity: 0.7;
  }
  .checklist-item.checked .check-box {
    background: var(--ng);
    border-color: var(--ng);
  }
  .check-box {
    width: 18px; height: 18px;
    border: 2px solid rgba(0,255,135,0.5);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .progress-bar {
    height: 3px;
    background: rgba(0,255,135,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ng), var(--nc));
    transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 12px var(--ng);
  }
  .slide-content h2 { letter-spacing: -0.02em; }
  .slide-content ul { list-style: none; padding: 0; }
  .slide-content li { position: relative; padding-left: 1.4rem; margin-bottom: 0.55rem; }
  .slide-content li::before {
    content: '';
    position: absolute; left: 0; top: 0.55em;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--nc);
    box-shadow: 0 0 8px var(--nc);
  }
  .tag {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .tag-blue { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.4); }
  .tag-green { background: rgba(0,255,135,0.15); color: var(--ng); border: 1px solid rgba(0,255,135,0.35); }
  .tag-red { background: rgba(255,0,128,0.15); color: var(--np); border: 1px solid rgba(255,0,128,0.35); }
  .tag-yellow { background: rgba(255,204,0,0.12); color: var(--ny); border: 1px solid rgba(255,204,0,0.3); }
  #visualizer { image-rendering: auto; }
  .modal-backdrop {
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(8px);
  }
  .scrollbar-thin::-webkit-scrollbar { width: 5px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,255,135,0.25); border-radius: 3px; }

  /* ===== DESKTOP / TABLET ===== */
  @media (max-width: 1100px) {
    .right-panel { display: none !important; }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    body { overflow: hidden; }

    .sidebar {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 280px !important;
      max-width: 85vw;
      height: 100%;
      height: 100dvh;
      z-index: 50;
      transform: translateX(-105%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 1px solid rgba(0,255,135,0.25);
    }
    .sidebar.open {
      transform: translateX(0);
    }

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 45;
      backdrop-filter: blur(4px);
    }
    .mobile-overlay.show {
      display: block;
    }

    .right-panel { display: none !important; }

    /* Main column takes full width */
    .main-column {
      width: 100% !important;
      min-width: 0;
    }

    /* Header adjustments */
    header {
      padding-left: 0.75rem !important;
      padding-right: 0.75rem !important;
      gap: 0.5rem;
    }
    #slideTitle {
      max-width: 42vw !important;
      font-size: 0.8rem !important;
    }

    /* Content area */
    .slide-content {
      padding: 1.25rem 1rem !important;
      max-width: 100% !important;
    }
    .slide-content h1 {
      font-size: 1.6rem !important;
      line-height: 1.25 !important;
    }
    .slide-content h2 {
      font-size: 1.35rem !important;
    }
    .slide-content .text-3xl,
    .slide-content .text-4xl {
      font-size: 1.55rem !important;
    }
    .slide-content .text-lg {
      font-size: 1rem !important;
    }

    /* Footer */
    footer {
      padding-left: 0.75rem !important;
      padding-right: 0.75rem !important;
      height: auto !important;
      min-height: 3.5rem;
      padding-top: 0.6rem;
      padding-bottom: 0.6rem;
    }
    footer .flex.gap-4 {
      gap: 1rem !important;
    }
  }

  /* Very small phones */
  @media (max-width: 380px) {
    .btn-ghost, .btn-primary {
      padding-left: 0.6rem !important;
      padding-right: 0.6rem !important;
      font-size: 0.7rem !important;
    }
    #slideTitle { max-width: 36vw !important; }
  }
</style>
</head>
<body>
<div class="flex h-full">
  <!-- Mobile Overlay -->
  <div id="mobileOverlay" class="mobile-overlay fixed inset-0 bg-black/60 z-30" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar w-72 glass-strong flex flex-col panel-glow border-r border-[rgba(0,255,135,0.15)] z-40">
    <div class="p-5 border-b border-[rgba(0,255,135,0.12)]">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-[rgba(0,255,135,0.15)] border border-[rgba(0,255,135,0.4)] flex items-center justify-center">
          <span class="neon-g font-bold text-lg mono">N</span>
        </div>
        <div>
          <div class="neon-g font-semibold tracking-wide text-sm">NEXUS CECT</div>
          <div class="text-[10px] text-slate-400 mono">HOOD BOSS QA • v3.2</div>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto scrollbar-thin py-3 px-2" id="navList"></div>

    <div class="p-4 border-t border-[rgba(0,255,135,0.12)]">
      <div class="flex items-center justify-between text-[11px] mb-2">
        <span class="text-slate-400">PROGRESS</span>
        <span id="progressText" class="neon-g mono">0/15</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
      <div class="mt-3 text-[10px] text-slate-500 mono text-center">
        AntManThePro • Field Ops
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-column flex-1 flex flex-col min-w-0 w-full">
    <!-- Header -->
    <header class="h-14 glass flex items-center px-3 sm:px-4 md:px-6 justify-between border-b border-[rgba(0,255,135,0.12)] shrink-0">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-1 text-slate-400 hover:text-[var(--ng)] shrink-0" aria-label="Open menu">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h16M3 12h16M3 18h16"/></svg>
        </button>
        <button onclick="prevSlide()" class="btn-ghost px-2.5 sm:px-3 py-1.5 rounded text-xs flex items-center gap-1.5 shrink-0">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          <span class="hidden xs:inline">BACK</span>
        </button>
        <div id="slideTitle" class="font-semibold text-sm md:text-base neon-p truncate min-w-0"></div>
      </div>
      <div class="flex items-center gap-3 md:gap-5">
        <button onclick="toggleTimer()" id="timerBtn" class="flex items-center gap-2 text-xs mono text-slate-400 hover:text-[var(--nc)] transition-colors">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5.5"/><path d="M7 4v3.5l2 1.5"/></svg>
          <span id="timerDisplay">00:00</span>
        </button>
        <button onclick="nextSlide()" class="btn-primary px-3 sm:px-4 py-1.5 rounded text-xs flex items-center gap-1.5 shrink-0">
          NEXT
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto scrollbar-thin relative">
      <div id="slideContent" class="slide-content max-w-3xl mx-auto p-6 md:p-10"></div>
    </main>

    <!-- Footer Controls -->
    <footer class="h-14 sm:h-16 glass flex items-center px-3 sm:px-4 md:px-6 justify-between border-t border-[rgba(0,255,135,0.12)] text-xs shrink-0">
      <div class="flex gap-3 sm:gap-5">
        <button onclick="markComplete()" class="flex items-center gap-1.5 sm:gap-2 text-slate-400 hover:text-[var(--ng)] transition-colors">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
          <span>COMPLETE</span>
        </button>
        <button onclick="openQuiz()" class="flex items-center gap-1.5 sm:gap-2 text-slate-400 hover:text-[var(--np)] transition-colors">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5.5"/><path d="M7 5.5v2.5M7 10h.01"/></svg>
          <span>QUIZ</span>
        </button>
      </div>
      <div class="hidden sm:block text-[10px] text-slate-500 mono text-right leading-tight">
        DOUBLEA • ANTMANTHEPRO<br>
        <span class="text-slate-600">PORTFOLIO ARTIFACT</span>
      </div>
    </footer>
  </div>

  <!-- RIGHT VISUALIZER -->
  <aside class="right-panel w-80 glass-strong border-l border-[rgba(0,255,135,0.15)] flex flex-col panel-glow">
    <div class="p-4 border-b border-[rgba(0,255,135,0.12)]">
      <div class="text-xs neon-g mono tracking-widest">PROTOCOL VISUALIZER</div>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center p-4">
      <canvas id="visualizer" width="280" height="320" class="rounded-lg border border-[rgba(96,239,255,0.2)]"></canvas>
      <div id="vizLegend" class="mt-5 w-full space-y-2 text-[11px]"></div>
    </div>
    <div class="p-4 border-t border-[rgba(0,255,135,0.12)] text-[10px] text-slate-500 mono text-center">
      Real-time state • Canvas driven
    </div>
  </aside>
</div>

<!-- QUIZ MODAL -->
<div id="quizModal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
  <div class="glass-strong max-w-md w-full rounded-xl p-6 panel-glow border border-[rgba(255,0,128,0.3)]">
    <div id="quizBody"></div>
  </div>
</div>

</body>
</html>
